<style>
  :root{
    --bg:#F5F2EA; --surface:#FFFFFF; --ink:#242A31; --muted:#767D87;
    --navy:#1B2733; --navy2:#233240; --amber:#F2A93B; --amber-dark:#D68F1E;
    --green:#3C8562; --green-bg:#E7F2EC; --red:#C0453A; --red-bg:#FBEAE8;
    --blue:#3B6EA5; --blue-bg:#E9F0F7; --border:#E4DFD3; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}

  .nav-item{position:relative;padding:12px 20px 12px 24px;cursor:pointer;color:rgba(255,255,255,.72);font-weight:500;display:flex;align-items:center;gap:10px;}

  .sidebar-foot{margin-top:auto;padding:14px 20px;font-size:11px;color:rgba(255,255,255,.35);border-top:1px solid rgba(255,255,255,.08);}
  .main{flex:1;padding:26px 34px 60px 34px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;}
  .page-head h2{font-size:22px;}
  .roadline{height:0;border-top:3px dashed var(--amber-dark);opacity:.55;margin:14px 0 24px 0;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .card .value{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .card.pos .value{color:var(--green);} .card.neg .value{color:var(--red);}
  .card.clickable{cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .card.clickable:hover{box-shadow:0 3px 10px rgba(0,0,0,.08);transform:translateY(-1px);border-color:var(--amber-dark);}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;overflow-x:auto;}
  .panel h3{font-size:15px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:10px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:#FBFAF7;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  .money-input{font-family:'IBM Plex Mono',monospace;text-align:right;}
  textarea{resize:vertical;}
  form .row{display:flex;gap:12px;} form .row > div{flex:1;}
  button{cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;border:none;border-radius:8px;padding:9px 16px;font-size:13px;}
  .btn-amber{background:var(--amber);color:#1B2733;} .btn-amber:hover{background:var(--amber-dark);}
  .btn-navy{background:var(--navy);color:#fff;} .btn-navy:hover{background:var(--navy2);}

  .btn-danger{background:var(--red-bg);color:var(--red);}

  .btn-row{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;font-size:13px;}

  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.gelir{background:var(--green-bg);color:var(--green);} .tag.gider{background:var(--red-bg);color:var(--red);}
  .tag.method{background:var(--blue-bg);color:var(--blue);}
  .empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px;}
  .warn-banner{border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;font-size:13px;}
  .warn-banner.amber{background:#FFF4E0;border:1px solid var(--amber-dark);color:#7A5209;}
  .warn-banner.red{background:var(--red-bg);border:1px solid var(--red);color:#8C332A;}

  .chip{display:inline-flex;align-items:center;gap:6px;background:#F1EEE5;border-radius:20px;padding:5px 11px;font-size:12px;margin:3px 4px 3px 0;cursor:pointer;border:1px solid transparent;}

  .muted-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .link-btn{background:none;border:none;color:var(--blue);font-weight:600;cursor:pointer;padding:0;font-size:12px;}
  .search-row{display:flex;gap:10px;margin-bottom:14px;} .search-row input{max-width:260px;}
  .login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy);}

  .login-box h1{font-size:22px;margin-bottom:6px;} .login-box form{text-align:left;}
  .tabbar{display:flex;gap:8px;margin-bottom:14px;}
  .tabbar button{flex:1;background:#F1EEE5;color:var(--muted);}
  .tabbar button.active{background:var(--navy);color:#fff;}
  .schedule-view{background:#fff;padding:10px;}
  .lesson-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--border);}
  .lesson-row:last-child{border-bottom:none;}
  .msg-wrap{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);height:65vh;overflow:hidden;}
  .msg-people{width:220px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
  .msg-person{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;}
  .msg-person:hover{background:#F1EEE5;} .msg-person.active{background:var(--navy);color:#fff;}
  .msg-person .sub{font-size:11px;color:var(--muted);} .msg-person.active .sub{color:rgba(255,255,255,.6);}
  .msg-main{flex:1;display:flex;flex-direction:column;}
  .msg-thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .msg-bubble{max-width:70%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;}
  .msg-bubble.mine{align-self:flex-end;background:var(--amber);color:#1B2733;border-bottom-right-radius:3px;}
  .msg-bubble.theirs{align-self:flex-start;background:#F1EEE5;color:var(--ink);border-bottom-left-radius:3px;}
  .msg-bubble .who{font-size:10px;font-weight:700;opacity:.6;margin-bottom:2px;}
  .msg-bubble .when{font-size:10px;opacity:.55;margin-top:3px;}
  .msg-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
  .msg-input-row textarea{resize:none;} .msg-input-row button{flex-shrink:0;}
  .mobile-topbar{display:none;}
  .messenger-panel{width:320px;height:440px;}
  @media (max-width: 420px){
    #messenger-widget{right:8px !important;bottom:8px !important;}
    .messenger-panel{width:calc(100vw - 16px);height:60vh;}
  }
  .loading{padding:60px 0;text-align:center;color:var(--muted);}
  .modal:fullscreen{display:flex;flex-direction:column;justify-content:flex-start;background:var(--bg);width:100vw;max-width:100vw;height:100vh;max-height:100vh;padding:24px;}
  @media (max-width: 780px){
    #app{flex-direction:column;}
    .mobile-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:41;}
    .mobile-topbar h1{font-size:16px;} .mobile-topbar .who{font-size:11px;color:rgba(255,255,255,.6);}
    .sidebar{width:100%;flex-direction:row;padding:0;position:fixed;bottom:0;left:0;right:0;overflow-x:auto;z-index:40;border-top:1px solid rgba(255,255,255,.12);}
    .sidebar .brand, .sidebar .sidebar-foot{display:none;}
    .sidebar > div:nth-child(2){display:flex;flex:1;}
    .nav-item{flex-direction:column;justify-content:center;align-items:center;padding:8px 14px 7px 14px;font-size:10px;gap:2px;white-space:nowrap;flex-shrink:0;}
    .nav-item.active::before{top:auto;bottom:0;left:0;right:0;width:auto;height:3px;}
    .main{padding:16px 14px 84px 14px;max-width:100%;}
    #global-search-wrap{padding:12px 14px 0 14px !important;}
    #global-search-wrap #global-search-input{max-width:100% !important;}
    #global-search-results{left:14px !important;width:calc(100% - 28px) !important;}
    .grid2{grid-template-columns:1fr;} .cards{grid-template-columns:repeat(2,1fr);}
    table{font-size:12px;} .modal{width:94vw;padding:18px 16px;}
    .msg-wrap{flex-direction:column;height:auto;} .msg-people{width:100%;max-height:140px;} .msg-thread{height:45vh;}
  }
</style>

<body>
<div id="app"></div>
<script>
// =========================================================
// Supabase bağlantı bilgileri
// =========================================================
const SUPABASE_URL = 'https://gzoeewfoetmbdkwcgoqn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8SzDYhGFZwmT_-8MSUpTmA_2p_i5zn1';

let session = null;   // { access_token, refresh_token, user }
let profile = null;   // { id, ad_soyad, role, aktif, izinler }
let state = { students:[], vehicles:[], vehicleRecords:[], transactions:[], schedules:[], lessons:[],
              messages:[], smsTemplates:[], smsLog:[], bankAccounts:[], customCategories:[],
              instructors:[], profiles:[], appSettings:{} };
let currentTab = 'kasa';
let modal = null;
let authMode = 'signin'; // 'signin' | 'signup'

const EXPENSE_CATEGORIES = [
  "Elektrik faturası","Su faturası","İnternet faturası","Doğalgaz/Isınma faturası","Telefon faturası","Kira",
  "Yakıt","Araç sigortası","Araç bakım/tamir","Araç muayene/vize","Trafik cezası",
  "E-sınav harcı","Direksiyon sınav harcı","KDV","Gelir vergisi","SGK primi",
  "Personel maaşı","Komisyon","Aidat","Muhasebe ödemesi","Banka masrafı/komisyonu",
  "Kırtasiye/ofis gideri","Reklam/pazarlama gideri","Temizlik gideri","Diğer"
];
const INCOME_METHODS = ["Nakit","Kredi Kartı","Havale/EFT"];
const LICENSE_CLASSES = [
  "B","A1","A2","A","C","D","BE","CE",
  "B'den C'ye","C'den CE'ye","B'den A1'e","B'den A2'ye","B'den A'ya",
  "A1'den B'ye","A2'den B'ye","A'dan B'ye"
];
const TABS = [
  {id:'kasa', label:'Kasa', icon:'💰'},
  {id:'ogrenciler', label:'Öğrenciler', icon:'🎓'},
  {id:'araclar', label:'Araçlar', icon:'🚗'},
  {id:'program', label:'Ders Programı', icon:'🗓️'},
  {id:'raporlar', label:'Raporlar', icon:'📊'},
  {id:'sms', label:'SMS', icon:'✉️'},
  {id:'mesajlar', label:'Mesajlar', icon:'💬'},
  {id:'egiticiler', label:'Eğiticiler', icon:'🧑‍🏫'},
  {id:'ayarlar', label:'Ayarlar', icon:'⚙️'},
];
const DEFAULT_IZIN = {kasaErisim:false, araclarErisim:true, raporlarErisim:false, smsErisim:true, ayarlarErisim:false, ogrencilerErisim:'kendi'};

// ---------- Supabase REST helpers (ham fetch, SDK yok) ----------
async function sbFetch(path, options={}){
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${session? session.access_token : SUPABASE_ANON_KEY}`,
    ...(options.headers||{})
  };
  const res = await fetch(`${SUPABASE_URL}${path}`, {...options, headers});
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if(!res.ok){ throw new Error((data && (data.message||data.msg||data.error_description)) || res.statusText); }
  return data;
}
const fetchTable = (table, query='') => sbFetch(`/rest/v1/${table}?${query}`, {method:'GET'});
const insertRow = (table, row) => sbFetch(`/rest/v1/${table}`, {method:'POST', headers:{'Prefer':'return=representation'}, body:JSON.stringify(row)});
const updateRow = (table, match, patch) => {
  const qs = Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
  return sbFetch(`/rest/v1/${table}?${qs}`, {method:'PATCH', headers:{'Prefer':'return=representation'}, body:JSON.stringify(patch)});
};
const deleteRow = (table, match) => {
  const qs = Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
  return sbFetch(`/rest/v1/${table}?${qs}`, {method:'DELETE'});
};
async function signIn(email, password){
  const data = await sbFetch('/auth/v1/token?grant_type=password', {method:'POST', body:JSON.stringify({email,password})});
  session = data;
  persistSession();
}
function persistSession(){ try{ localStorage.setItem('sb_session', JSON.stringify({access_token:session.access_token, refresh_token:session.refresh_token})); }catch(e){} }
function clearPersistedSession(){ try{ localStorage.removeItem('sb_session'); }catch(e){} }
async function loadCoreDataAfterAuth(){
  currentTab = profile.role==='admin' ? 'kasa' : 'program';
  try{ state.vehicles = await fetchTable('vehicles','order=plaka.asc'); }catch(e){}
  try{ state.students = await fetchTable('students','order=ad_soyad.asc'); }catch(e){}
  try{ state.schedules = await fetchTable('schedules'); }catch(e){}
  try{ if(profile.role==='admin') state.instructors = await fetchTable('profiles','role=eq.egitici&order=ad_soyad.asc'); }catch(e){}
  try{ state.profiles = await fetchTable('profiles','select=id,ad_soyad,role,aktif'); }catch(e){}
  try{ state.messages = await fetchTable('messages','order=created_at.asc&limit=500'); }catch(e){}
  __knownMessageIds = new Set((state.messages||[]).map(m=>m.id));
}
async function restoreSession(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem('sb_session')||'null'); }catch(e){ saved=null; }
  if(!saved || !saved.refresh_token) return;
  try{
    const data = await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:JSON.stringify({refresh_token: saved.refresh_token})});
    session = data; persistSession();
    const profs = await fetchTable('profiles', `id=eq.${session.user.id}`);
    profile = profs && profs[0];
    if(!profile){ session=null; profile=null; clearPersistedSession(); return; }
    await loadCoreDataAfterAuth();
    resetInactivityTimer();
    startMessagePolling();
    startTokenRefreshTimer();
  }catch(e){
    session=null; profile=null; clearPersistedSession();
  }
}
let __tokenRefreshTimer=null;
function startTokenRefreshTimer(){
  if(__tokenRefreshTimer) clearInterval(__tokenRefreshTimer);
  __tokenRefreshTimer = setInterval(async ()=>{
    if(!session || !session.refresh_token) return;
    try{
      const data = await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:JSON.stringify({refresh_token: session.refresh_token})});
      session = data; persistSession();
    }catch(e){ /* sessizce yoksay */ }
  }, 50*60*1000);
}
async function signUp(email, password, adSoyad){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify({email,password,data:{ad_soyad:adSoyad}})
  });
  const data = await res.json();
  if(!res.ok){ throw new Error((data && (data.message||data.msg||data.error_description)) || res.statusText); }
  return data;
}
function signOut(){ session=null; profile=null; clearPersistedSession(); if(__inactivityTimer) clearTimeout(__inactivityTimer); if(__tokenRefreshTimer) clearInterval(__tokenRefreshTimer); currentUser_reset(); }
const INACTIVITY_LIMIT_MS = 30*60*1000; // 30 dakika hareketsizlik sonrası otomatik çıkış
let __inactivityTimer=null;
function resetInactivityTimer(){
  if(!session) return;
  if(__inactivityTimer) clearTimeout(__inactivityTimer);
  __inactivityTimer = setTimeout(()=>{
    if(session){
      signOut();
      alert('Güvenlik nedeniyle 30 dakika hareketsizlik sonrası oturumun kapatıldı. Lütfen tekrar giriş yap.');
    }
  }, INACTIVITY_LIMIT_MS);
}
document.addEventListener('click', resetInactivityTimer);
document.addEventListener('keydown', resetInactivityTimer);
function currentUser_reset(){ currentTab='kasa'; render(); }

// ---------- şifremi unuttum / şifre sıfırlama ----------
async function sendPasswordReset(email){
  const redirectTo = window.location.origin + window.location.pathname;
  await sbFetch(`/auth/v1/recover?redirect_to=${encodeURIComponent(redirectTo)}`, {
    method:'POST', body: JSON.stringify({email})
  });
}
let recoverySession = null; // sıfırlama linkiyle gelen geçici oturum
async function setNewPassword(newPassword){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method:'PUT',
    headers:{
      'Content-Type':'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${recoverySession.access_token}`
    },
    body: JSON.stringify({password:newPassword})
  });
  const data = await res.json();
  if(!res.ok){ throw new Error((data && (data.message||data.msg||data.error_description)) || res.statusText); }
  return data;
}
async function changeOwnPassword(newPassword){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method:'PUT',
    headers:{
      'Content-Type':'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${session.access_token}`
    },
    body: JSON.stringify({password:newPassword})
  });
  const data = await res.json();
  if(!res.ok){ throw new Error((data && (data.message||data.msg||data.error_description)) || res.statusText); }
  return data;
}
function checkRecoveryLink(){
  // Supabase, sıfırlama linkinden dönünce token'ları URL'in hash kısmına (#...) koyar
  const hash = window.location.hash;
  if(!hash || hash.indexOf('access_token')===-1) return;
  const params = new URLSearchParams(hash.slice(1));
  if(params.get('type')!=='recovery') return;
  recoverySession = { access_token: params.get('access_token'), refresh_token: params.get('refresh_token') };
  authMode = 'reset';
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

// ---------- utils ----------
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtMoney = n => (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const fmtDate = d => { if(!d) return '-'; const [y,m,day]=d.split('-'); return `${day}.${m}.${y}`; };
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00')-today)/86400000);
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatMoneyLive(el){
  let raw = el.value.replace(/[^0-9,]/g,'');
  const fc = raw.indexOf(',');
  if(fc!==-1){ raw = raw.slice(0,fc+1) + raw.slice(fc+1).replace(/,/g,''); }
  let [ip, dp] = raw.split(',');
  ip = (ip||'').replace(/^0+(?=\d)/,'');
  if(dp!==undefined) dp = dp.slice(0,2);
  const withSep = ip.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  el.value = dp!==undefined ? withSep+','+dp : withSep;
}
function moneyValue(str){ if(!str) return 0; return Number(str.toString().replace(/\./g,'').replace(',', '.'))||0; }
function allCategories(){ return [...EXPENSE_CATEGORIES.filter(c=>c!=='Diğer'), ...state.customCategories.map(c=>c.ad), 'Diğer']; }
function studentPaid(studentId){
  return state.transactions.filter(t=>t.tur==='gelir' && t.ogrenci_id===studentId).reduce((a,t)=>a+Number(t.tutar),0);
}

function izinlerOf(p){ return {...DEFAULT_IZIN, ...(p&&p.izinler||{})}; }
function canTab(tabId){
  if(!profile) return false;
  if(profile.role==='admin') return true;
  const p = izinlerOf(profile);
  if(tabId==='egiticiler') return false;
  if(tabId==='ayarlar') return !!p.ayarlarErisim;
  if(tabId==='kasa') return !!p.kasaErisim;
  if(tabId==='araclar') return !!p.araclarErisim;
  if(tabId==='raporlar') return !!p.raporlarErisim;
  if(tabId==='sms') return !!p.smsErisim;
  if(tabId==='ogrenciler') return !!p.ogrencilerErisim && p.ogrencilerErisim!=='yok';
  return true;
}
function visibleTabs(){ return TABS.filter(t=>canTab(t.id)); }

// ---------- genel arama ----------
function textMatches(field, q){ return (field||'').toString().toLowerCase().includes(q); }
function globalSearchResults(q){
  q = (q||'').trim().toLowerCase();
  if(q.length<2) return [];
  const out = [];
  (state.students||[]).forEach(s=>{ if(textMatches(s.ad_soyad,q)||textMatches(s.telefon,q)) out.push({kind:'student', id:s.id, icon:'🎓', label:s.ad_soyad, sub:'Öğrenci'}); });
  (state.vehicles||[]).forEach(v=>{ if(textMatches(v.plaka,q)||textMatches(v.marka,q)||textMatches(v.model,q)) out.push({kind:'vehicle', id:v.id, icon:'🚗', label:v.plaka, sub:[v.marka,v.model].filter(Boolean).join(' ')||'Araç'}); });
  (state.schedules||[]).forEach(sc=>{ if(textMatches(sc.baslik,q)) out.push({kind:'schedule', id:sc.id, icon:'🗓️', label:sc.baslik, sub:'Ders Programı'}); });
  if(profile && profile.role==='admin') (state.instructors||[]).forEach(i=>{ if(textMatches(i.ad_soyad,q)) out.push({kind:'instructor', id:i.id, icon:'🧑‍🏫', label:i.ad_soyad, sub:i.role==='admin'?'Yönetici':'Eğitici'}); });
  return out.slice(0,8);
}
function renderGlobalSearchResults(){
  const box = document.getElementById('global-search-results'); if(!box) return;
  const q = window.__globalSearchQuery||'';
  const results = globalSearchResults(q);
  if(q.trim().length<2 || !results.length){
    box.style.display = q.trim().length>=2 ? 'block' : 'none';
    box.innerHTML = q.trim().length>=2 ? `<div style="padding:10px 12px;font-size:12px;color:var(--muted);">Sonuç bulunamadı.</div>` : '';
    return;
  }
  box.style.display = 'block';
  box.innerHTML = results.map(r=>`<div data-action="global-search-goto" data-kind="${r.kind}" data-id="${r.id}" style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:8px;align-items:center;">
    <span>${r.icon}</span><div><div style="font-weight:600;">${esc(r.label)}</div><div style="font-size:11px;color:var(--muted);">${esc(r.sub)}</div></div>
  </div>`).join('');
}

// ---------- data loading per tab ----------
async function loadTabData(tabId){
  if(tabId==='kasa'){
    state.transactions = await fetchTable('transactions','order=tarih.desc,created_at.desc&limit=8000');
    state.students = await fetchTable('students','order=ad_soyad.asc');
    state.bankAccounts = await fetchTable('bank_accounts','order=ad.asc');
  } else if(tabId==='ogrenciler'){
    state.students = await fetchTable('students','order=ad_soyad.asc');
    state.transactions = await fetchTable('transactions','order=tarih.desc&limit=8000');
    if(profile.role==='admin') state.instructors = await fetchTable('profiles','role=eq.egitici&order=ad_soyad.asc');
  } else if(tabId==='araclar'){
    state.vehicles = await fetchTable('vehicles','order=plaka.asc');
    state.vehicleRecords = await fetchTable('vehicle_records');
  } else if(tabId==='program'){
    state.schedules = await fetchTable('schedules');
    state.lessons = await fetchTable('lessons');
    state.students = await fetchTable('students','order=ad_soyad.asc');
    state.profiles = await fetchTable('profiles','select=id,ad_soyad,role');
  } else if(tabId==='raporlar'){
    state.transactions = await fetchTable('transactions','order=tarih.desc&limit=1000');
    state.students = await fetchTable('students','order=ad_soyad.asc');
  } else if(tabId==='sms'){
    state.students = await fetchTable('students','order=ad_soyad.asc');
    state.smsTemplates = await fetchTable('sms_templates');
    state.smsLog = await fetchTable('sms_log','order=created_at.desc&limit=50');
  } else if(tabId==='egiticiler'){
    state.instructors = await fetchTable('profiles','role=eq.egitici&order=ad_soyad.asc');
  } else if(tabId==='ayarlar'){
    state.bankAccounts = await fetchTable('bank_accounts','order=ad.asc');
    state.customCategories = await fetchTable('custom_categories','order=ad.asc');
    const s = await fetchTable('app_settings');
    state.appSettings = (s && s[0]) || {netgsm_user:'',netgsm_pass:'',netgsm_header:''};
  }
}

function insuranceWarnings(){
  const warns=[];
  state.vehicles.forEach(v=>{
    const d = daysUntil(v.sigorta_bitis);
    if(d!==null){
      if(d<0) warns.push({key:`${v.id}|sigorta|${v.sigorta_bitis}`, vehicleId:v.id, level:'red', text:`${v.plaka} plakalı aracın sigortası ${fmtDate(v.sigorta_bitis)} tarihinde doldu.`});
      else if(d<=7) warns.push({key:`${v.id}|sigorta|${v.sigorta_bitis}`, vehicleId:v.id, level:'amber', text:`${v.plaka} plakalı aracın sigortası ${d===0?'bugün doluyor':d+' gün sonra doluyor'} (${fmtDate(v.sigorta_bitis)}).`});
    }
    const dm = daysUntil(v.muayene_bitis);
    if(dm!==null){
      if(dm<0) warns.push({key:`${v.id}|muayene|${v.muayene_bitis}`, vehicleId:v.id, level:'red', text:`${v.plaka} plakalı aracın muayenesi ${fmtDate(v.muayene_bitis)} tarihinde doldu.`});
      else if(dm<=7) warns.push({key:`${v.id}|muayene|${v.muayene_bitis}`, vehicleId:v.id, level:'amber', text:`${v.plaka} plakalı aracın muayenesi ${dm===0?'bugün doluyor':dm+' gün sonra doluyor'} (${fmtDate(v.muayene_bitis)}).`});
    }
  });
  return warns;
}
let dismissedWarningKeys = new Set();
try{ dismissedWarningKeys = new Set(JSON.parse(localStorage.getItem('dismissedWarnings')||'[]')); }catch(e){}
let __lastToastSoundCount = 0;
function activeWarnings(){ return insuranceWarnings().filter(w=>!dismissedWarningKeys.has(w.key)); }
function dismissWarning(key){
  dismissedWarningKeys.add(key);
  try{ localStorage.setItem('dismissedWarnings', JSON.stringify([...dismissedWarningKeys])); }catch(e){}
  render();
}
function playAlertBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.36);
  }catch(e){}
}
function renderToastContainer(){
  let el = document.getElementById('toast-container');
  const warns = activeWarnings();
  if(!el){
    el = document.createElement('div'); el.id='toast-container';
    el.style.cssText = 'position:fixed;bottom:16px;left:16px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:340px;';
    document.body.appendChild(el);
  }
  el.innerHTML = warns.map(w=>`
    <div class="toast-item ${w.level}" style="background:${w.level==='red'?'#FBEAE8':'#FFF4E0'};border:1px solid ${w.level==='red'?'#C0453A':'#D68F1E'};color:${w.level==='red'?'#8C332A':'#7A5209'};border-radius:10px;padding:10px 12px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;gap:8px;align-items:flex-start;">
      <span>⚠️</span>
      <div style="flex:1;line-height:1.4;">${esc(w.text)}</div>
      <span data-action="dismiss-warning" data-key="${esc(w.key)}" style="cursor:pointer;font-weight:700;opacity:.7;flex-shrink:0;">✕</span>
    </div>
  `).join('');
  if(warns.length > __lastToastSoundCount) playAlertBeep();
  __lastToastSoundCount = warns.length;
}

function renderDayLedger(dateStr, dayTransactions, devir){
  const studentName = id => { const s=state.students.find(x=>x.id===id); return s? s.ad_soyad : ''; };
  const gelirRows = dayTransactions.filter(t=>t.tur==='gelir');
  const giderRows = dayTransactions.filter(t=>t.tur==='gider');
  const gelirToplam = gelirRows.reduce((a,t)=>a+Number(t.tutar),0);
  const giderToplam = giderRows.reduce((a,t)=>a+Number(t.tutar),0);
  const maxRows = Math.max(gelirRows.length, giderRows.length, 1);
  const gelirLabel = t => { const n = esc(studentName(t.ogrenci_id)) || esc(t.aciklama) || 'Gelir'; return `${n}${t.yontem?` <span style="color:var(--muted);">(${esc(t.yontem)}${t.banka?' · '+esc(t.banka):''})</span>`:''}`; };
  const giderLabel = t => esc(t.aciklama) || esc(t.kategori) || 'Gider';
  let rowsHtml = '';
  for(let i=0;i<maxRows;i++){
    const g = gelirRows[i], gi = giderRows[i];
    rowsHtml += `<tr>
      <td>${g? gelirLabel(g) : ''}</td>
      <td class="mono" style="color:var(--green);white-space:nowrap;">${g? fmtMoney(g.tutar):''}</td>
      <td style="white-space:nowrap;">${g? `<button class="btn-ghost btn-sm" data-action="open-edit-transaction" data-id="${g.id}">✎</button><button class="btn-ghost btn-sm" data-action="del-transaction" data-id="${g.id}">✕</button>`:''}</td>
      <td>${gi? giderLabel(gi) : ''}</td>
      <td class="mono" style="color:var(--red);white-space:nowrap;">${gi? fmtMoney(gi.tutar):''}</td>
      <td style="white-space:nowrap;">${gi? `<button class="btn-ghost btn-sm" data-action="open-edit-transaction" data-id="${gi.id}">✎</button><button class="btn-ghost btn-sm" data-action="del-transaction" data-id="${gi.id}">✕</button>`:''}</td>
    </tr>`;
  }
  const araToplam = devir + gelirToplam;
  const net = araToplam - giderToplam;
  return `
    <div class="muted-note" style="margin-bottom:8px;">DEVİR (önceki günlerden gelen bakiye): <b class="mono">${fmtMoney(devir)}</b></div>
    <table><thead><tr><th>ÖDEME (GELEN)</th><th>Tutar</th><th></th><th>ÖDEME (GİDEN)</th><th>Tutar</th><th></th></tr></thead>
    <tbody>${rowsHtml}</tbody></table>
    <div class="roadline" style="margin:10px 0;"></div>
    <div class="cards">
      <div class="card pos"><div class="label">Gün Sonu Toplam (Gelen)</div><div class="value">${fmtMoney(gelirToplam)}</div></div>
      <div class="card neg"><div class="label">Gün Sonu Toplam (Giden)</div><div class="value">${fmtMoney(giderToplam)}</div></div>
      <div class="card"><div class="label">Ara Toplam (Devir+Gelen)</div><div class="value">${fmtMoney(araToplam)}</div></div>
      <div class="card ${net>=0?'pos':'neg'}"><div class="label">Net (Devir+Gelen-Giden)</div><div class="value">${fmtMoney(net)}</div></div>
    </div>
  `;
}
function renderKasaHistoryTree(){
  const today = todayStr();
  const byDate = {};
  state.transactions.forEach(t=>{ (byDate[t.tarih] = byDate[t.tarih]||[]).push(t); });
  const dates = Object.keys(byDate).filter(d=>d!==today).sort((a,b)=>b.localeCompare(a));
  if(!dates.length) return `<div class="empty">Geçmiş kayıt yok.</div>`;
  const tree = {};
  dates.forEach(d=>{
    const [y,m,day] = d.split('-');
    tree[y] = tree[y]||{}; tree[y][m] = tree[y][m]||{}; tree[y][m][day] = d;
  });
  const monthNames = ['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const open = window.__kasaTreeOpen || {};
  const years = Object.keys(tree).sort((a,b)=>b.localeCompare(a));
  return years.map(y=>{
    const yKey = `y-${y}`; const yOpen = !!open[yKey];
    const months = Object.keys(tree[y]).sort((a,b)=>b.localeCompare(a));
    return `<div style="margin-bottom:4px;">
      <div data-action="toggle-kasa-tree" data-key="${yKey}" style="cursor:pointer;font-weight:700;padding:8px 4px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);">
        <span>${yOpen?'▾':'▸'}</span> ${y}
      </div>
      ${yOpen? months.map(m=>{
        const mKey = `${yKey}-m-${m}`; const mOpen = !!open[mKey];
        const days = Object.keys(tree[y][m]).sort((a,b)=>b.localeCompare(a));
        return `<div style="margin-left:16px;">
          <div data-action="toggle-kasa-tree" data-key="${mKey}" style="cursor:pointer;font-weight:600;padding:7px 4px;display:flex;align-items:center;gap:6px;">
            <span>${mOpen?'▾':'▸'}</span> ${monthNames[parseInt(m,10)]}
          </div>
          ${mOpen? days.map(day=>{
            const fullDate = tree[y][m][day]; const dKey = `${mKey}-d-${day}`; const dOpen = !!open[dKey];
            return `<div style="margin-left:16px;">
              <div data-action="toggle-kasa-tree" data-key="${dKey}" style="cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:6px;">
                <span>${dOpen?'▾':'▸'}</span> ${fmtDate(fullDate)}
              </div>
              ${dOpen? `<div style="margin:6px 0 14px 16px;">${renderDayLedger(fullDate, byDate[fullDate], devirForDate(fullDate))}</div>` : ''}
            </div>`;
          }).join('') : ''}
        </div>`;
      }).join('') : ''}
    </div>`;
  }).join('');
}

function filteredTransactions(){
  const f = window.__reportFilters || {};
  return state.transactions.filter(t=>{
    if(f.from && t.tarih < f.from) return false;
    if(f.to && t.tarih > f.to) return false;
    if(f.ogrenciId && t.ogrenci_id !== f.ogrenciId) return false;
    if(f.tur && t.tur !== f.tur) return false;
    if(f.q){ const q=f.q.toLowerCase(); const hay=`${t.aciklama||''} ${t.kategori||''} ${t.yontem||''}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

  const toplamGider = rows.filter(t=>t.tur==='gider').reduce((a,t)=>a+Number(t.tutar),0);

      <label>Açıklama / Kategori / Yöntem içinde ara</label>

      ${rows.length? `<table><thead><tr><th>Tarih</th><th>Tür</th><th>Kategori/Yöntem</th><th>Öğrenci</th><th>Açıklama</th><th>Tutar</th></tr></thead><tbody>

function activeConvo(){ return window.__activeConvo || {type:'genel', view:'list'}; }
function convoMessages(){
  const convo = activeConvo();
  if(convo.type==='genel') return state.messages.filter(m=>m.kanal==='genel');
  return state.messages.filter(m=> m.kanal==='ozel' && (
    (m.gonderen_id===profile.id && m.alici_id===convo.withId) || (m.gonderen_id===convo.withId && m.alici_id===profile.id)
  ));
}
function msgLastSeenKey(){ return `msgLastSeen_${profile.id}`; }
function getMsgLastSeen(){ try{ return localStorage.getItem(msgLastSeenKey())||'1970-01-01T00:00:00.000Z'; }catch(e){ return '1970-01-01T00:00:00.000Z'; } }
function setMsgLastSeenNow(){ try{ localStorage.setItem(msgLastSeenKey(), new Date().toISOString()); }catch(e){} }
function unreadMessageCount(){
  const lastSeen = getMsgLastSeen();
  return (state.messages||[]).filter(m=> m.gonderen_id!==profile.id && m.created_at>lastSeen && (m.kanal==='genel' || m.alici_id===profile.id)).length;
}
function playMessageSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const now = ctx.currentTime;
    [660,880].forEach((f,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, now+i*0.09);
      g.gain.exponentialRampToValueAtTime(0.13, now+i*0.09+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+i*0.09+0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+i*0.09); o.stop(now+i*0.09+0.24);
    });
  }catch(e){}
}
async function uploadMessageFile(file){
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `${profile.id}/${Date.now()}_${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/mesaj-dosyalari/${path}`, {
    method:'POST',
    headers:{ 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': file.type || 'application/octet-stream' },
    body: file
  });
  if(!res.ok){ const t = await res.text(); throw new Error(t || res.statusText); }
  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/mesaj-dosyalari/${path}`;
  return { url: publicUrl, name: file.name, isImage: (file.type||'').startsWith('image/') };
}

  return msgs.map(m=>`<div class="msg-bubble ${m.gonderen_id===profile.id?'mine':'theirs'}" style="max-width:82%;">
    <div class="who">${esc(nameOf(m.gonderen_id))}</div>

let __msgPollTimer=null;
let __knownMessageIds = new Set();
function startMessagePolling(){
  if(__msgPollTimer) clearInterval(__msgPollTimer);
  __msgPollTimer = setInterval(async ()=>{
    if(!session) return;
    try{
      const fresh = await fetchTable('messages','order=created_at.asc&limit=500');
      let hasNewIncoming = false;
      fresh.forEach(m=>{
        if(!__knownMessageIds.has(m.id) && m.gonderen_id!==profile.id && (m.kanal==='genel' || m.alici_id===profile.id)) hasNewIncoming = true;
      });
      __knownMessageIds = new Set(fresh.map(m=>m.id));
      state.messages = fresh;
      if(hasNewIncoming){
        playMessageSound();
        if(window.__msgWidgetOpen) setMsgLastSeenNow();
      }
      updateMsgWidgetLive();
    }catch(e){ /* sessizce yoksay */ }
  }, 5000);
}
function updateMsgWidgetLive(){
  if(!window.__msgWidgetOpen){ renderMessengerWidget(); return; }
  const convo = activeConvo();
  if(convo.view==='thread'){
    const thread = document.getElementById('msg-thread');
    if(thread){ thread.innerHTML = renderThreadMessagesHtml(); scrollMsgThreadToBottom(); }
  } else {
    updateMsgPeopleList();
  }
}

async function exportFullBackup(){
  const btn = document.getElementById('export-backup-btn');
  if(btn){ btn.disabled=true; btn.textContent='Yedekleniyor...'; }
  const tables = ['students','vehicles','vehicle_records','transactions','schedules','lessons','messages','sms_templates','sms_log','bank_accounts','custom_categories','profiles','app_settings'];
  const backup = { __olusturulma_tarihi: new Date().toISOString() };
  for(const t of tables){
    try{ backup[t] = await fetchTable(t); }catch(e){ backup[t] = {hata:e.message}; }
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `direksiyon-ofis-yedek-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  if(btn){ btn.disabled=false; btn.textContent='Tüm Verileri Yedekle (.json indir)'; }
  alert('Yedek dosyası indirildi.');
}

function exportStudentsExcel(){
  if(!window.XLSX){ alert('Excel kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.'); return; }
  const summaryRows = state.students.map(s=>{
    const paid = studentPaid(s.id);
    const remaining = Number(s.ucret||0) - paid;
    return {
      'Ad Soyad': s.ad_soyad, 'Telefon': s.telefon||'', 'Ehliyet Sınıfı': s.ehliyet_sinifi||'',
      'Kayıt Tarihi': s.kayit_tarihi||'', 'Ücret': Number(s.ucret||0), 'Ödenen': paid, 'Kalan': remaining
    };
  });
  const paymentRows = state.transactions
    .filter(t=>t.tur==='gelir' && t.ogrenci_id)
    .map(t=>{
      const s = state.students.find(x=>x.id===t.ogrenci_id);
      return { 'Tarih': t.tarih, 'Öğrenci': s? s.ad_soyad : '(silinmiş öğrenci)', 'Tutar': Number(t.tutar), 'Yöntem': t.yontem||'', 'Banka/POS': t.banka||'', 'Açıklama': t.aciklama||'' };
    })
    .sort((a,b)=> a.Tarih.localeCompare(b.Tarih));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'Öğrenci Özet');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(paymentRows), 'Ödeme Detayları');
  XLSX.writeFile(wb, `ogrenci-odemeleri-${todayStr()}.xlsx`);
}

function normalizeHeaderKey(h){
  return (h||'').toString().trim().toLowerCase()
    .replace(/ı/g,'i').replace(/i̇/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
}
function normalizeDateForImport(val){
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);
  const s = (val||'').toString().trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return todayStr();
}
async function importStudentsFromFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
  let success=0, fail=0;
  for(const row of rows){
    const norm = {};
    Object.keys(row).forEach(k=>{ norm[normalizeHeaderKey(k)] = row[k]; });
    const adSoyad = (norm['ad soyad'] || norm['adsoyad'] || norm['isim'] || '').toString().trim();
    if(!adSoyad){ fail++; continue; }
    const telefon = (norm['telefon']||'').toString().trim();
    const ehliyet = (norm['ehliyet sinifi']||norm['sinif']||norm['ehliyet']||'').toString().trim();
    const ucret = moneyValue((norm['ucret']!==undefined? norm['ucret'] : 0).toString());
    const kayitTarihi = normalizeDateForImport(norm['kayit tarihi']||norm['tarih']);
    try{
      await insertRow('students', {
        ad_soyad: adSoyad, telefon, ehliyet_sinifi: ehliyet, kayit_tarihi: kayitTarihi,
        ucret, egitici_id: profile.role==='admin' ? null : profile.id
      });
      success++;
    }catch(e){ fail++; }
  }
  return { success, fail, total: rows.length };
}
function exportSchedulePdf(scheduleId){
  const sc = state.schedules.find(x=>x.id===scheduleId); if(!sc) return;
  const student = state.students.find(x=>x.id===sc.ogrenci_id);
  if(!window.jspdf){ alert('PDF kütüphanesi yüklenemedi.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text(sc.baslik || 'Ders Programi', 14, 18);
  doc.setFontSize(11);
  doc.text(`Ogrenci: ${student? student.ad_soyad : '-'}`, 14, 28);
  doc.text(`Periyot: ${sc.periyot==='haftalik'?'Haftalik':'Aylik'}`, 14, 34);
  let y=46; doc.setFontSize(10);
  doc.text('Tarih',14,y); doc.text('Saat',60,y); doc.text('Konu / Not',90,y); y+=4; doc.line(14,y,196,y); y+=6;
  const lessons = state.lessons.filter(l=>l.schedule_id===sc.id).sort((a,b)=>a.tarih.localeCompare(b.tarih)||(a.saat||'').localeCompare(b.saat||''));
  if(!lessons.length) doc.text('Henuz ders eklenmedi.',14,y);
  lessons.forEach(d=>{ if(y>280){doc.addPage(); y=20;} doc.text(fmtDate(d.tarih),14,y); doc.text(d.saat||'-',60,y); doc.text((d.konu||'-').slice(0,45),90,y); y+=8; });
  doc.save(`ders-programi-${(student?student.ad_soyad:'ogrenci').replace(/\s+/g,'_')}.pdf`);
}

  if(e.target.dataset.role==='report-filter' && e.target.type==='text'){
    window.__reportFilters = window.__reportFilters||{}; window.__reportFilters[e.target.dataset.field]=e.target.value; render();
    setTimeout(()=>{ const inp=document.querySelector('input[data-field="q"]'); if(inp){ inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length; } },0);
  }
});
document.addEventListener('focus', (e)=>{
  if(e.target.id==='global-search-input') renderGlobalSearchResults();
  if(e.target.classList && e.target.classList.contains('money-input')) e.target.select();
}, true);
document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey && e.target.closest && e.target.closest('form[data-action="send-message"]')){ e.preventDefault(); e.target.closest('form').requestSubmit(); }
});

document.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form=e.target, action=form.dataset.action, fd=new FormData(form);
  try{
    if(action==='do-signin'){
      await signIn(fd.get('email'), fd.get('password'));
      const profs = await fetchTable('profiles', `id=eq.${session.user.id}`);
      profile = profs && profs[0];
      if(!profile){ alert('Profil bulunamadı, lütfen tekrar deneyin.'); session=null; clearPersistedSession(); render(); return; }
      await loadCoreDataAfterAuth();
      resetInactivityTimer();
      render(); startMessagePolling(); startTokenRefreshTimer();
    }
    else if(action==='do-signup'){
      await signUp(fd.get('email'), fd.get('password'), fd.get('adSoyad'));
      alert('Kayıt başarılı! Şimdi giriş yapabilirsiniz. Yönetici size yetki tanımlayana kadar erişiminiz sınırlı olacak.');
      authMode='signin'; render();
    }
    else if(action==='do-forgot'){
      await sendPasswordReset(fd.get('email'));
      alert('E-posta adresine bir sıfırlama linki gönderildi. Gelen kutunu (ve spam klasörünü) kontrol et.');
      authMode='signin'; render();
    }
    else if(action==='do-reset'){
      const p1=fd.get('password'), p2=fd.get('password2');
      if(p1!==p2){ alert('Şifreler birbiriyle eşleşmiyor.'); return; }
      await setNewPassword(p1);
      recoverySession=null;
      alert('Şifren güncellendi. Şimdi yeni şifrenle giriş yapabilirsin.');
      authMode='signin'; render();
    }
    else if(action==='edit-transaction'){
      const id = form.dataset.id;
      const t = state.transactions.find(x=>x.id===id);
      const patch = { tarih: fd.get('tarih'), tutar: moneyValue(fd.get('tutar')), aciklama: fd.get('aciklama')||null };
      if(t.tur==='gelir'){
        patch.yontem = fd.get('yontem');
        patch.banka = fd.get('yontem')!=='Nakit' ? (fd.get('banka')||'') : '';
      } else {
        let kategori = fd.get('kategori'); if(kategori==='Diğer' && fd.get('digerKategori')) kategori=fd.get('digerKategori');
        patch.kategori = kategori;
      }
      await updateRow('transactions', {id}, patch);
      modal=null; await goToTab('kasa');
    }
    else if(action==='add-income'){
      const banka = fd.get('yontem')!=='Nakit' ? (fd.get('banka')||'') : '';
      await insertRow('transactions', {tarih:fd.get('tarih'), tur:'gelir', tutar:moneyValue(fd.get('tutar')), yontem:fd.get('yontem'), banka, aciklama:fd.get('aciklama')||null, ogrenci_id:fd.get('ogrenciId')||null});
      modal=null; await goToTab(currentTab==='kasa'?'kasa':'kasa'); currentTab='kasa'; await goToTab('kasa');
    }
    else if(action==='add-expense'){
      let kategori = fd.get('kategori'); if(kategori==='Diğer' && fd.get('digerKategori')) kategori=fd.get('digerKategori');
      await insertRow('transactions', {tarih:fd.get('tarih'), tur:'gider', tutar:moneyValue(fd.get('tutar')), kategori, aciklama:fd.get('aciklama')||null});
      await goToTab('kasa');
    }
    else if(action==='add-student'){
      const egiticiId = profile.role==='admin' ? (fd.get('egiticiId')||null) : profile.id;
      await insertRow('students', {ad_soyad:fd.get('adSoyad'), telefon:fd.get('telefon'), ehliyet_sinifi:fd.get('ehliyetSinifi'), kayit_tarihi:fd.get('kayitTarihi'), ucret:moneyValue(fd.get('ucret')), notlar:fd.get('notlar'), egitici_id:egiticiId});
      modal=null; await goToTab('ogrenciler');
    }
    else if(action==='do-import-students'){
      const file = form.querySelector('input[type=file]').files[0];
      if(!file){ alert('Lütfen bir dosya seç.'); return; }
      if(!window.XLSX){ alert('Excel kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.'); return; }
      const submitBtn = form.querySelector('button[type=submit]'); if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent='İçe aktarılıyor...'; }
      const result = await importStudentsFromFile(file);
      modal=null;
      alert(`İçe aktarma tamamlandı: ${result.success} öğrenci eklendi, ${result.fail} satır atlandı (toplam ${result.total} satır okundu).`);
      await goToTab('ogrenciler');
    }
    else if(action==='quick-payment'){
      const sid = form.dataset.sid;
      const banka = fd.get('yontem')!=='Nakit' ? (fd.get('banka')||'') : '';
      await insertRow('transactions', {tarih:todayStr(), tur:'gelir', tutar:moneyValue(fd.get('tutar')), yontem:fd.get('yontem'), banka, aciklama:fd.get('aciklama')||null, ogrenci_id:sid});
      await loadTabData('ogrenciler'); render(); modal={type:'student-detail', id:sid}; render();
    }
    else if(action==='add-vehicle'){
      await insertRow('vehicles', {plaka:fd.get('plaka'), marka:fd.get('marka'), model:fd.get('model'), sigorta_bitis:fd.get('sigortaBitis')||null, muayene_bitis:fd.get('muayeneBitis')||null});
      modal=null; await goToTab('araclar');
    }
    else if(action==='renew-vehicle-dates'){
      const vid = form.dataset.vid;
      await updateRow('vehicles', {id:vid}, {sigorta_bitis:fd.get('sigortaBitis')||null, muayene_bitis:fd.get('muayeneBitis')||null});
      await loadTabData('araclar'); render(); modal={type:'vehicle-detail', id:vid}; render();
    }
    else if(action==='add-vehicle-record'){
      const vid = form.dataset.vid;
      const rec = {vehicle_id:vid, tarih:fd.get('tarih'), tip:fd.get('tip'), aciklama:fd.get('aciklama'), tutar:moneyValue(fd.get('tutar'))};
      await insertRow('vehicle_records', rec);
      if(fd.get('kasayaEkle')){
        const v = state.vehicles.find(x=>x.id===vid);
        await insertRow('transactions', {tarih:rec.tarih, tur:'gider', tutar:rec.tutar, kategori:'Araç bakım/tamir', aciklama:`${v?v.plaka:''} - ${rec.aciklama||(rec.tip==='bakim'?'bakım':'tamir')}`});
      }
      await loadTabData('araclar'); render(); modal={type:'vehicle-detail', id:vid}; render();
    }
    else if(action==='add-schedule'){
      const s = state.students.find(x=>x.id===fd.get('ogrenciId'));
      const egiticiId = profile.role==='admin' ? (s? s.egitici_id : null) : profile.id;
      await insertRow('schedules', {ogrenci_id:fd.get('ogrenciId'), egitici_id:egiticiId, baslik:fd.get('baslik'), periyot:fd.get('periyot'), baslangic:fd.get('baslangic')});
      await goToTab('program');
    }
    else if(action==='add-lesson'){
      const sid = form.dataset.sid;
      await insertRow('lessons', {schedule_id:sid, tarih:fd.get('tarih'), saat:fd.get('saat'), konu:fd.get('konu')});
      state.lessons = await fetchTable('lessons');
      render(); modal={type:'schedule-detail', id:sid}; render();
    }
    else if(action==='send-message'){
      const text=(fd.get('mesaj')||'').trim();
      const fileInput = document.getElementById('msg-file-input');
      const file = fileInput && fileInput.files && fileInput.files[0];
      if(!text && !file) return;
      const convo = activeConvo();
      const payload = { kanal: convo.type==='genel'?'genel':'ozel', gonderen_id:profile.id, alici_id: convo.type==='dm'? convo.withId : null, mesaj:text };
      if(file){
        try{
          const uploaded = await uploadMessageFile(file);
          payload.dosya_url = uploaded.url; payload.dosya_adi = uploaded.name; payload.dosya_tip = uploaded.isImage?'image':'file';
        }catch(err){ alert('Dosya gönderilemedi: '+err.message); return; }
      }
      await insertRow('messages', payload);
      state.messages = await fetchTable('messages','order=created_at.asc&limit=500');
      __knownMessageIds = new Set(state.messages.map(m=>m.id));
      setMsgLastSeenNow();
      renderMessengerWidget();
    }
    else if(action==='change-own-password'){
      const p1=fd.get('password'), p2=fd.get('password2');
      if(p1!==p2){ alert('Şifreler birbiriyle eşleşmiyor.'); return; }
      await changeOwnPassword(p1);
      modal=null; render();
      alert('Şifren güncellendi.');
    }
    else if(action==='add-instructor-admin'){
      await signUp(fd.get('email'), fd.get('password'), fd.get('adSoyad'));
      modal=null;
      alert('Eğitici eklendi. Girdiğin e-posta/şifre ile giriş yapabilir.');
      await goToTab('egiticiler');
    }
    else if(action==='edit-instructor'){
      const id = form.dataset.id;
      await updateRow('profiles', {id}, {
        ad_soyad: fd.get('adSoyad'), telefon: fd.get('telefon'), aktif: !!fd.get('aktif'), role: fd.get('rol'),
        izinler: {
          kasaErisim: !!fd.get('kasaErisim'), araclarErisim: !!fd.get('araclarErisim'),
          raporlarErisim: !!fd.get('raporlarErisim'), smsErisim: !!fd.get('smsErisim'),
          ayarlarErisim: !!fd.get('ayarlarErisim'), ogrencilerErisim: fd.get('ogrencilerErisim')
        }
      });
      modal=null;
      if(fd.get('rol')==='admin') alert(`${fd.get('adSoyad')} artık Yönetici oldu.`);
      await goToTab('egiticiler');
    }
    else if(action==='save-netgsm'){
      const patch = {netgsm_user:fd.get('netgsm_user'), netgsm_pass:fd.get('netgsm_pass'), netgsm_header:fd.get('netgsm_header')};
      if(state.appSettings.id){ await updateRow('app_settings',{id:1}, patch); } else { await insertRow('app_settings', {id:1, ...patch}); }
      await goToTab('ayarlar'); alert('Kaydedildi.');
    }
    else if(action==='add-bank'){ await insertRow('bank_accounts', {ad:fd.get('ad')}); await goToTab('ayarlar'); }
    else if(action==='add-category'){ await insertRow('custom_categories', {ad:fd.get('kategori')}); await goToTab('ayarlar'); }
    else if(action==='add-sms-template'){ await insertRow('sms_templates', {ad:fd.get('ad'), mesaj:fd.get('mesaj')}); await goToTab('sms'); }
    else if(action==='send-sms'){
      const alicilar = Array.from(document.querySelectorAll('input[name="alici"]:checked')).map(cb=>cb.value);
      const mesaj = fd.get('mesaj');
      if(!alicilar.length){ alert('Lütfen en az bir alıcı seçin.'); return; }
      if(!mesaj){ alert('Lütfen bir mesaj yazın.'); return; }
      const res = await fetch(`${SUPABASE_URL}/functions/v1/send-sms`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${session.access_token}`, 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({ studentIds: alicilar, message: mesaj })
      });
      const data = await res.json();
      if(!res.ok){ alert('Hata: '+(data.error||'gönderilemedi')); return; }
      window.__smsDraft=''; await goToTab('sms');
      alert(`Gönderim tamamlandı: ${data.successCount}/${data.total} başarılı.`);
    }
  } catch(err){ alert('Hata: '+err.message); }
});

checkRecoveryLink();
if(recoverySession){ render(); } else { restoreSession().then(render).catch(render); }
</script>
</body>
</html>
